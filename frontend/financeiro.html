<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Financeiro</title>

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/financeiro.css">

<link rel="icon" href="/favicon.ico">

</head>

<body>

    <button
class="menu-mobile"
id="btnMenu"
onclick="abrirMenu()">

    ☰

</button>

<div class="sidebar">

    <h2>Vincent Criatório</h2>

    <ul>

        <li><a href="index.html">Dashboard</a></li>
        <li><a href="coelhos.html">Coelhos</a></li>
        <li><a href="vendas.html">Vendas</a></li>
        <li><a href="financeiro.html">Financeiro</a></li>

    </ul>

</div>

<div class="content">

    <h1>Controle Financeiro</h1>

    <div class="cards-financeiro">

        <div class="card-fin">
            <h3>Entradas</h3>
            <span id="entradas">R$ 0,00</span>
        </div>

        <div class="card-fin">
            <h3>Saídas</h3>
            <span id="saidas">R$ 0,00</span>
        </div>

        <div class="card-fin">
            <h3>Saldo Atual</h3>
            <span id="saldo">R$ 0,00</span>
        </div>

    </div>

    <div class="formulario">

        <input type="date" id="data">

        <select id="tipo">

            <option value="Entrada">
                Entrada
            </option>

            <option value="Saida">
                Saída
            </option>

        </select>

        <select id="categoria" placeholder="Categoria">
            <option value="">Categoria</option>
            <option>Aquisição de Coelho</option>
            <option>Alimentação</option>
            <option>Material</option>
            <option>Derivados</option>
        </select>

        <input
        type="text"
        id="observacao"
        placeholder="Observação">

        <input
        type="number"
        step="0.01"
        id="valor"
        placeholder="Valor">

        <button onclick="adicionarLancamento()">
            Salvar
        </button>

    </div>

    <div class="tabela-container">
    <table>

        <thead>

            <tr>

                <th>Data</th>
                <th>Tipo</th>
                <th>Categoria</th>
                <th>Observação</th>
                <th>Valor</th>
                <th>Ação</th>

            </tr>

        </thead>

        <tbody id="tabelaLancamentos">

        </tbody>

    </table></div>

</div>

<script src="js/financeiro.js"></script>
<script src="js/menu.js"></script>

</body>
</html>
