    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/ninhadas.css">

    <link rel="icon" href="/favicon.ico">

    <link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

</head>

<body>
    
    <button
class="menu-mobile"
id="btnMenu"
onclick="abrirMenu()">

    ☰

</button>

<div class="sidebar">

    <h2>Vincent Criatório</h2>

    <ul>
        <li><a href="index.html">Dashboard</a></li>
        <li><a href="coelhos.html">Coelhos</a></li>

        <li><a href="financeiro.html">Financeiro</a></li>
    </ul>

</div>

<div class="content">

    <h1>Controle de Ninhadas</h1>

    <div class="cards">

        <div class="card">
            <div class="card-icon">
            <i class="bi bi-house-heart"></i>
        </div>
            <h3>Ninhadas</h3>
            <span id="totalNinhadas">0</span>
        </div>

        <div class="card">
            <div class="card-icon">
            <i class="bi bi-graph-up-arrow"></i>
        </div>
            <h3>Nascidos</h3>
            <span id="totalNascidos">0</span>
        </div>

        <div class="card">
            <div class="card-icon">
            <i class="bi bi-heart-fill"></i>
        </div>
            <h3>Vivos</h3>
            <span id="totalVivos">0</span>
        </div>

        <div class="card">
            <div class="card-icon">
            <i class="bi bi-heartbreak"></i>
        </div>
            <h3>Mortos</h3>
            <span id="totalMortos">0</span>
        </div>

    </div>

    <div class="formulario">

        <select id="mae"></select>

        <input type="date" id="dataParto">

        <input type="number" id="nascidos" placeholder="Nascidos">

        <input type="number" id="vivos" placeholder="Vivos">

        <input type="number" id="mortos" placeholder="Mortos">

        <button onclick="salvarNinhada()">
            Registrar Parto
        </button>

    </div>
    
    <div class="tabela-container">
    <table>

        <thead>

            <tr>
                <th>Mãe</th>
                <th>Pai</th>
                <th>Data Parto</th>
                <th>Nascidos</th>
                <th>Vivos</th>
                <th>Mortos</th>
                <th>Desmame Previsto</th>
                <th>Status</th>
                <th>Ação</th>
            </tr>

        </thead>

        <tbody id="tabelaNinhadas">

        </tbody>

    </table></div>

</div>

<script src="js/ninhadas.js"></script>
<script src="js/menu.js"></script>

</body>
</html>
